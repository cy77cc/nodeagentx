syntax = "proto3";
package opsagent;
option go_package = "github.com/cy77cc/opsagent/internal/grpcclient/proto";

service AgentService {
  rpc Connect(stream AgentMessage) returns (stream PlatformMessage);
}

message AgentMessage {
  oneof payload {
    AgentRegistration registration = 1;
    Heartbeat heartbeat = 2;
    MetricBatch metrics = 3;
    ExecOutput exec_output = 4;
    ExecResult exec_result = 5;
    Ack ack = 6;
    HealthCheckResult health_check_result = 7;
    // Gateway tunnel
    TunnelOpen tunnel_open = 8;
    TunnelData tunnel_data = 9;
    TunnelClose tunnel_close = 10;
    ProxyHostRegister proxy_register = 11;
    ProxyCommandResponse proxy_response = 12;
    ProxyMetricBatch proxy_metrics = 13;
  }
}

message PlatformMessage {
  oneof payload {
    ExecuteCommand exec_command = 1;
    ExecuteScript exec_script = 2;
    CancelJob cancel_job = 3;
    ConfigUpdate config_update = 4;
    Ack ack = 5;
    HealthCheckRequest health_check = 6;
    // Gateway tunnel
    TunnelData tunnel_data = 7;
    TunnelClose tunnel_close = 8;
    ProxyCommandRequest proxy_command = 9;
  }
}

message AgentRegistration {
  string agent_id = 1;
  string token = 2;
  AgentInfo agent_info = 3;
  repeated string capabilities = 4;
}

message AgentInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string version = 4;
  int32 cpu_cores = 5;
  int64 memory_bytes = 6;
  int32 running_tasks = 7;
  int32 max_tasks = 8;
}

message Heartbeat {
  string agent_id = 1;
  int64 timestamp_ms = 2;
  string status = 3;
  AgentInfo agent_info = 4;
}

message MetricBatch {
  repeated Metric metrics = 1;
}

message Metric {
  string name = 1;
  map<string, string> tags = 2;
  repeated Field fields = 3;
  int64 timestamp_ms = 4;
  MetricType type = 5;
}

message Field {
  string key = 1;
  oneof value {
    double double_value = 2;
    int64 int_value = 3;
    string string_value = 4;
    bool bool_value = 5;
  }
}

enum MetricType {
  GAUGE = 0;
  COUNTER = 1;
  HISTOGRAM = 2;
}

message ExecuteCommand {
  string task_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  int32 timeout_seconds = 5;
  SandboxConfig sandbox = 6;
}

message ExecuteScript {
  string task_id = 1;
  string interpreter = 2;
  string script = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  int32 timeout_seconds = 6;
  SandboxConfig sandbox = 7;
}

message SandboxConfig {
  int32 memory_mb = 1;
  int32 cpu_quota_pct = 2;
  int32 max_pids = 3;
  string network_mode = 4;
  repeated string allowed_ips = 5;
  int32 max_output_kb = 6;
}

message ExecOutput {
  string task_id = 1;
  string stream = 2;
  bytes data = 3;
  int64 timestamp_ms = 4;
}

message ExecResult {
  string task_id = 1;
  int32 exit_code = 2;
  int64 duration_ms = 3;
  bool timed_out = 4;
  bool truncated = 5;
  bool killed = 6;
  ExecStats stats = 7;
}

message ExecStats {
  int64 peak_memory_bytes = 1;
  int64 cpu_time_user_ms = 2;
  int64 cpu_time_system_ms = 3;
  int32 process_count = 4;
  int64 bytes_written = 5;
  int64 bytes_read = 6;
}

message CancelJob {
  string task_id = 1;
  string reason = 2;
}

message ConfigUpdate {
  bytes config_yaml = 1;
  int64 version = 2;
}

message Ack {
  string ref_id = 1;
  bool success = 2;
  string error = 3;
}

message HealthCheckRequest {
  string request_id = 1;
  repeated CheckItem items = 2;
  int32 timeout_seconds = 3;
}

message CheckItem {
  string id = 1;
  string type = 2;
  string category = 3;
  string name = 4;
  string description = 5;
  bytes params = 6;
  CheckSeverity severity = 7;
}

enum CheckSeverity {
  SEVERITY_INFO = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
  SEVERITY_CRITICAL = 4;
}

message HealthCheckResult {
  string request_id = 1;
  repeated CheckResult results = 2;
  CheckSummary summary = 3;
  bool completed = 4;
}

message CheckResult {
  string item_id = 1;
  string type = 2;
  string name = 3;
  CheckStatus status = 4;
  string actual_value = 5;
  string expected_value = 6;
  string message = 7;
  string remediation = 8;
  CheckSeverity severity = 9;
  int64 duration_ms = 10;
}

enum CheckStatus {
  STATUS_PASS = 0;
  STATUS_FAIL = 1;
  STATUS_WARN = 2;
  STATUS_ERROR = 3;
  STATUS_SKIP = 4;
}

message CheckSummary {
  int32 total = 1;
  int32 pass = 2;
  int32 fail = 3;
  int32 warn = 4;
  int32 error = 5;
  int32 skip = 6;
  int64 total_duration_ms = 7;
}

// --- Gateway Tunnel Messages ---

message TunnelOpen {
  string tunnel_id = 1;
  string agent_id = 2;       // C's agent ID
  string hostname = 3;
  string ip = 4;
  repeated string capabilities = 5;
}

message TunnelData {
  string tunnel_id = 1;
  bytes payload = 2;         // Serialized AgentMessage or PlatformMessage
}

message TunnelClose {
  string tunnel_id = 1;
  string reason = 2;
}

message ProxyHostRegister {
  string host_id = 1;
  string hostname = 2;
  string ip = 3;
  repeated string capabilities = 4;
}

message ProxyCommandRequest {
  string host_id = 1;
  string command = 2;
  repeated string args = 3;
  int32 timeout_seconds = 4;
}

message ProxyCommandResponse {
  string host_id = 1;
  string command = 2;
  int32 exit_code = 3;
  bytes stdout = 4;
  bytes stderr = 5;
  int64 duration_ms = 6;
  bool timed_out = 7;
}

message ProxyMetricBatch {
  string host_id = 1;
  repeated Metric metrics = 2;
}
