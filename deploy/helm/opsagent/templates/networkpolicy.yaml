{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsagent.fullname" . }}
  labels:
    {{- include "opsagent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsagent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound HTTP traffic (health checks, metrics, API)
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- if .Values.networkPolicy.ingress }}
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow gRPC to platform
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    # Default: allow all egress (agent needs to reach platform, collectors, etc.)
    - {}
    {{- end }}
{{- end }}
