apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opsagent.fullname" . }}-test-connection"
  labels:
    {{- include "opsagent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "opsagent.fullname" . }}:{{ .Values.service.port }}/healthz', '-q', '-O-', '-T', '5']
